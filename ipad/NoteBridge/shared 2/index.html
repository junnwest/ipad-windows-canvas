<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>NoteBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ══════════════════════════════════════════════════════════
       LIBRARY SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="screen-library" class="screen">

    <!-- Top bar -->
    <div id="lib-top-bar">
      <span class="status-time" id="lib-time">9:41</span>
      <div style="flex:1"></div>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">
          <svg width="13" height="13" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="2.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="10" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10" y="10" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
          Covers
        </button>
        <button class="view-btn" data-view="shelf">
          <svg width="13" height="13" viewBox="0 0 18 18" fill="none"><path d="M5 5h10M5 9h10M5 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="2.5" cy="5" r="0.8" fill="currentColor"/><circle cx="2.5" cy="9" r="0.8" fill="currentColor"/><circle cx="2.5" cy="13" r="0.8" fill="currentColor"/></svg>
          Shelves
        </button>
      </div>
      <button class="status-pill" id="lib-status-pill">
        <span class="spill-dot"></span>
        <span class="spill-device">Desktop</span>
        <span class="spill-sep">·</span>
        <span class="spill-latency">Offline</span>
      </button>
      <button id="lib-settings-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5v2M9 14.5v2M2.6 5.5l1.7 1M13.7 11.5l1.7 1M2.6 12.5l1.7-1M13.7 6.5l1.7-1M1.5 9h2M14.5 9h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="status-trailing" id="lib-trailing"></div>
    </div>

    <!-- Hero header -->
    <div id="lib-hero">
      <div class="lib-hero-row">
        <div>
          <div class="lib-big-title">Library</div>
          <div class="lib-sub" id="lib-sub-text">7 notebooks</div>
        </div>
        <div class="lib-actions">
          <div class="lib-search-wrap">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M9.8 9.8L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <input id="lib-search-input" placeholder="Search notebooks…" type="text">
          </div>
          <button id="lib-new-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            New notebook
          </button>
        </div>
      </div>
    </div>

    <!-- Notebook content (grid/shelf, rendered by JS) -->
    <div id="lib-content"></div>

  </div><!-- /screen-library -->


  <!-- ══════════════════════════════════════════════════════════
       CANVAS SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="screen-canvas" class="screen hidden">

    <!-- Top bar: 44px -->
    <div id="top-bar">
      <span class="status-time" id="canvas-time">9:41</span>
      <button class="top-icon-btn" id="btn-back" title="Back to library">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 4l-5 5 5 5M6 9h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="top-center">
        <div id="notebook-title-bar">
          <span id="nb-color-bar"></span>
          <span id="nb-name">Untitled</span>
          <span id="nb-page-info" style="font-size:13px;color:var(--ink-mute);font-variant-numeric:tabular-nums;"></span>
        </div>
      </div>
      <button class="top-icon-btn" id="btn-pages" title="Pages overview">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="10.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="10.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="top-icon-btn" id="btn-share" title="Share &amp; export">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2v10M9 2L6 5M9 2l3 3M3.5 9v5.5h11V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="top-icon-btn" id="btn-bookmark" title="Bookmark">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 2h7v10l-3.5-2.5L3.5 12V2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="status-pill" id="canvas-status-pill">
        <span class="spill-dot"></span>
        <span class="spill-device">Desktop</span>
        <span class="spill-sep">·</span>
        <span class="spill-latency">Offline</span>
      </button>
      <div class="status-trailing" id="canvas-trailing"></div>
    </div>

    <!-- Canvas body: fills remaining height -->
    <div id="canvas-body">
      <canvas id="drawing-canvas"></canvas>
      <canvas id="cursor-canvas"></canvas>
      <div id="canvas-dots"></div>

      <!-- Floating toolbar: absolute, centered, top:16px -->
      <div id="floating-toolbar">
        <!-- Undo / Redo -->
        <button class="tb-btn" id="btn-undo" title="Undo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 7h8a4 4 0 010 8H6M3 7l3-3M3 7l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tb-btn" id="btn-redo" title="Redo">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15 7H7a4 4 0 000 8h5M15 7l-3-3M15 7l-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="tb-divider"></div>

        <!-- Tool buttons -->
        <button class="tb-btn" data-tool="pen" title="Pen">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M14.5 2.5l3 3-10 10L4 16l.5-3.5 10-10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.6 4.4l3 3" stroke="currentColor" stroke-width="1.4"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="highlighter" title="Highlighter">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4.6 14.4l-1.5 3h4l1.4-3M4.6 14.4l7.4-7.4 3 3-7.4 7.4H4.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 7l2.4-2.4 3 3L15 10" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="eraser" title="Eraser">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M11 3.5l5.5 5.5-7 7H5L3.5 14l7.5-10.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.5 7l5.5 5.5" stroke="currentColor" stroke-width="1.4"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="lasso" title="Lasso">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3.5 8c0-2.5 3-4.5 6.5-4.5s6.5 2 6.5 4.5c0 2-2 3.7-4.5 4.3" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/><path d="M9 13.5c0 2 .5 3.5-1.5 3.5s-2-2-1-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="text" title="Text">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h12M10 4v12M7 16h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="shape" title="Shape">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="9" height="9" stroke="currentColor" stroke-width="1.4"/><circle cx="13" cy="13" r="4" stroke="currentColor" stroke-width="1.4"/></svg>
          <span class="tb-dot"></span>
        </button>
        <button class="tb-btn" data-tool="hand" title="Hand">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 10V4.5a1.2 1.2 0 012.4 0V9M9.4 9V3.5a1.2 1.2 0 012.4 0V9M11.8 9V4.5a1.2 1.2 0 012.4 0v6.5c0 3.3-2 5.5-5 5.5-2.5 0-3.6-1.5-4.6-3l-1.5-2.3c-.7-1 .3-2.2 1.4-1.5l1.7 1V7a1.2 1.2 0 012.4 0v3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span class="tb-dot"></span>
        </button>

        <div class="tb-divider"></div>

        <!-- Pen well -->
        <div id="pen-well-wrap">
          <button id="pen-well-trigger">
            <span id="pw-color-dot"></span>
            <span id="pw-size-bar"></span>
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none" style="color:var(--ink-mute)"><path d="M2.5 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <!-- Pen well popup -->
          <div id="pen-well-popup" class="hidden">
            <div class="pw-label">Color</div>
            <div id="pw-colors"></div>
            <div class="pw-label" style="margin-top:12px">Size</div>
            <div id="pw-sizes"></div>
          </div>
        </div>
      </div><!-- /floating-toolbar -->

      <!-- Page nav: absolute, centered, bottom:18px -->
      <div id="page-nav">
        <button class="pn-btn" id="btn-prev" disabled title="Previous page">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M6.5 2.5l-3 3 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span id="page-indicator">1 / 1</span>
        <button class="pn-btn" id="btn-next" title="Next page">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M4.5 2.5l3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="pn-divider"></div>
        <button class="pn-btn" id="btn-add-page" title="Add page">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- Connection pill (dark, dismissable) -->
      <div id="connection-pill" class="hidden">
        <div class="cpill-dot"></div>
        <span id="cpill-device">Desktop PC</span>
        <span id="cpill-latency"></span>
        <button id="cpill-dismiss" title="Disconnect">×</button>
      </div>

    </div><!-- /canvas-body -->

  </div><!-- /screen-canvas -->


  <!-- ══════════════════════════════════════════════════════════
       SETTINGS SCREEN
  ══════════════════════════════════════════════════════════ -->
  <div id="screen-settings" class="screen hidden">

    <!-- Left rail -->
    <div id="settings-rail">
      <div class="settings-rail-top">
        <span class="status-time" id="settings-time">9:41</span>
      </div>
      <div class="settings-rail-title">Settings</div>
      <nav id="settings-nav">
        <button class="snav-btn active" data-section="connection">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 7.5c4-3.5 10-3.5 14 0M4.5 10c2.5-2.2 6.5-2.2 9 0M7 12.5c1.2-1 2.8-1 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="14.5" r="0.9" fill="currentColor"/></svg>
          Connection
        </button>
        <button class="snav-btn" data-section="pencil">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 13.5L3 15h1.5L13 6.5l-1.5-1.5L3 13.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11.5 5l1.5 1.5M2 16h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Apple Pencil
        </button>
        <button class="snav-btn" data-section="paper">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a7 7 0 100 14c1 0 1.5-.5 1.5-1.5S10 13 10 12s.7-1.5 1.5-1.5h2a2.5 2.5 0 002.5-2.5A7 7 0 009 2z" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="6" r="1" fill="currentColor"/></svg>
          Paper &amp; ink
        </button>
        <button class="snav-btn" data-section="sync">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 13h8.5a2.5 2.5 0 000-5 3.5 3.5 0 00-6.7-1A3 3 0 005 13z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Sync &amp; backup
        </button>
        <button class="snav-btn" data-section="shortcuts">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M5 5h10M5 9h10M5 13h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="2.5" cy="5" r="0.8" fill="currentColor"/><circle cx="2.5" cy="9" r="0.8" fill="currentColor"/><circle cx="2.5" cy="13" r="0.8" fill="currentColor"/></svg>
          Shortcuts
        </button>
        <button class="snav-btn" data-section="about">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M9 8v4M9 5.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          About
        </button>
      </nav>
      <div class="settings-version">NoteBridge · v1.0.0</div>
    </div>

    <!-- Right content -->
    <div id="settings-main">
      <div class="settings-main-top">
        <button id="btn-settings-done">Done</button>
        <div class="status-trailing" id="settings-trailing"></div>
      </div>
      <div id="settings-content">
        <!-- Rendered by JS -->
      </div>
    </div>

  </div><!-- /screen-settings -->


  <!-- ══════════════════════════════════════════════════════════
       MODAL CONTAINER (shown over current screen)
  ══════════════════════════════════════════════════════════ -->
  <div id="modal-container" class="hidden"></div>

</div><!-- /app -->

<script src="canvas.js"></script>
<script src="app.js"></script>
</body>
</html>
